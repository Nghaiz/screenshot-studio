[package]
name = "screenshot-studio"
description = "Screenshot Studio desktop app"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
# `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "screenshot_studio_lib"
# rlib only: the Windows exe links the lib as an rlib. staticlib/cdylib are the Tauri template's iOS/Android
# outputs; with fat LTO each one costs a full LTO pass, and the release build ran out of memory (phase 1.4).
crate-type = ["rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
ss-core.workspace = true
tauri.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-drag.workspace = true
tauri-plugin-fs.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
