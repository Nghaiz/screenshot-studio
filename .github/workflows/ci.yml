name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: UI (tsc, vitest, vite build)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: UI contract test (lane runner)
        run: node scripts/accept/lane-tests.mjs src/__tests__/contract.test.ts
      - name: Production build (tsc + vite)
        run: npm run build

  sidecar:
    name: Sidecar (JSON-RPC contract test, fake engines)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The real-model tests (test_ocr.py, test_embed.py) need multi-GB downloads and stay local (phase Accept).
      # The contract test runs the real server with fake engines: stdlib + jsonschema + pytest only.
      - name: Minimal venv (versions from sidecar/uv.lock)
        run: |
          python -m venv "${{ runner.temp }}\sidecar-venv"
          & "${{ runner.temp }}\sidecar-venv\Scripts\python.exe" -m pip install --disable-pip-version-check pytest==9.2.0 jsonschema==4.26.0
      - name: Sidecar contract test (lane runner)
        env:
          SS_SIDECAR_VENV: ${{ runner.temp }}\sidecar-venv
        run: node scripts/accept/lane-tests.mjs sidecar/tests/test_contract.py

  rust:
    name: Rust (contract test, app build)
    runs-on: windows-latest
    # Cold cache: ~400 crates (21 min on the dev box); Swatinem/rust-cache makes later runs a few minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Contract test (lane runner)
        run: node scripts/accept/lane-tests.mjs crates/ss-core/tests/contract_test.rs
      - name: All Rust tests
        run: cargo test --workspace --locked
      - name: Build the Tauri app crate
        run: cargo build -p screenshot-studio --locked
      # tauri-build copies `bundle.resources` next to the exe, exactly what the installer ships (phase 3.4). Each
      # glob there names ONE directory, so a new sidecar subpackage would be left out silently: compare with git.
      - name: Bundled sidecar resources match the tracked source
        shell: pwsh
        run: |
          $want = @(git ls-files -- 'sidecar/ss_sidecar/*.py' | ForEach-Object { $_ }) + 'contracts/sidecar-jsonrpc.schema.json'
          $got = @('sidecar', 'contracts') | ForEach-Object { Get-ChildItem "target/debug/$_" -Recurse -File -ErrorAction SilentlyContinue } |
            ForEach-Object { [IO.Path]::GetRelativePath("$PWD/target/debug", $_.FullName).Replace('\', '/') }
          $diff = Compare-Object ($want | Sort-Object) ($got | Sort-Object)
          if ($diff) { $diff | Format-Table | Out-String | Write-Host; throw 'bundle.resources do not match sidecar/ss_sidecar/**/*.py + the schema' }
          Write-Host "bundle.resources: $($want.Count) files match"
