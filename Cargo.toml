[workspace]
members = ["crates/ss-core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Nghaiz"]

# Every dependency of the whole plan is declared here in phase 1.1 (README D3).
# Frozen after 1.1: only the serial integration phases (1.4, 2.3, 3.4, 4.3) edit this file (D2).
[workspace.dependencies]
ss-core = { path = "crates/ss-core" }

# ss-core
blake3 = "1.8.7"
fast_image_resize = "6.2.0"
image = "0.25.10"
image_hasher = "3.1.1"
notify = "9.0.0"
notify-debouncer-full = "0.8.0"
printpdf = "0.12.14"
rayon = "1.12.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "rt-multi-thread", "sync", "time", "io-util"] }
trash = "5.4.0"
ts-rs = "12.0.1"
walkdir = "2.5.1"
webp = { version = "0.3.1", default-features = false } # lossy thumbnails from phase 2.1 (Deferred decision #29)
zip = "9.8.1"
jsonschema = { version = "0.63.0", default-features = false }
tempfile = "3.27.0"

# src-tauri
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-build = "2.7.6"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-drag = "2.1.1"
tauri-plugin-fs = "2.7.1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
# WebView2 memory target LOW (phase 3.4, Deferred decision #31). The exact versions tauri 2.12.7 / wry link (Cargo.lock),
# so `PlatformWebview::controller()` and these COM types are the same types.
webview2-com = "0.39.1"
windows-core = "0.62.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
